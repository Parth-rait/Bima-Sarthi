rule_id: GRIEVANCE_ROUTE
version: 1
group: cashless_process
title_en: "Grievance route: insurer, then Insurance Ombudsman"
title_hi: null
source_id: ombudsman_rules_2017
quote: "(b) The complaint is made within one year- (i) after the order of the insurer or the insurance broker, as the case may be, rejecting the representation is received;"
page_no: 10
in_force_from: 2021-05-18  # rules as amended till 18.05.2021 (p1, p13); original commencement date not stated in extracted text
in_force_to: null  # no end date stated
applies_by: claim_date  # time limits run from the insurer rejection / representation dates  [draft — confirm]
triggers: [other]
inputs: []
# Each parameter carries its own primary-text source. Corrected 1 Nov 2026 (Parth confirmed):
# replaces the plan's original 15-day reply / 30-day wait.
params:
  insurer_reply_days:
    value: 14
    unit: days
    source_id: irdai_ppi_master_2024
    page_no: 111  # also p123, p135
    quote: "Insurers should provide resolution to the complaint within 14 days"
  ombudsman_wait_months:
    value: 1
    unit: months
    source_id: ombudsman_rules_2017
    page_no: 10  # rule 14(3)
    quote: "the complainant had not received any reply within a period of one month after the insurer or the insurance broker, as the case may be, received his representation"
  ombudsman_limit_months:
    value: 12
    unit: months
    source_id: ombudsman_rules_2017
    page_no: 10
    quote: "The complaint is made within one year—"
  ombudsman_claim_limit_inr:
    value: 5000000
    unit: inr
    source_id: irdai_ppi_master_2024
    page_no: 135
    quote: "they can escalate the unresolved / partially resolved complaints to Insurance Ombudsman of concerned jurisdiction, in case the claim amount is up to Rs. 50 lakhs."
  ombudsman_award_cap_inr:
    value: 3000000
    unit: inr
    source_id: ombudsman_rules_2017
    page_no: 12  # rule 17(3)
    quote: "not award compensation exceeding rupees thirty lakhs (including relevant expenses, if any)"
