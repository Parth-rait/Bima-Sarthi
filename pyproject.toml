[project]
name = "bima-sarthi"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=3.42.0",
    "pydantic>=2.14.2",
    "pymupdf>=2.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sarthi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # pymupdf's SWIG bindings (SwigPyPacked/SwigPyObject/swigvarlink) on import
    "ignore:builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__ attribute:DeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
]
airflow = [
    "apache-airflow>=3.1",
    "apache-airflow-providers-standard",
]
