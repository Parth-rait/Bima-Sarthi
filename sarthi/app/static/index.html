<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bima Sarthi</title>
<style>
:root{--bg:#faf8f4;--fg:#1f2933;--muted:#4a5560;--line:#c9c3b6;--card:#fff;--accent:#1d5c63;--accent-fg:#fff;
--ok:#1e6b3a;--ok-bg:#e8f3ec;--bad:#8a2b1c;--bad-bg:#fbeae6;--info:#7a5200;--info-bg:#fdf3dc;--focus:#0b4fd6}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif;overflow-wrap:anywhere}
header,main,footer{max-width:46rem;margin:0 auto;padding:0 16px}
header{padding-top:16px;padding-bottom:8px}
h1{font-size:1.5rem;margin:0 0 4px}
h2{font-size:1.2rem;margin:24px 0 8px}
h3{font-size:1.05rem;margin:0 0 6px}
p{margin:8px 0}
.muted{color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:8px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--card);color:var(--fg);min-height:44px;padding:0 14px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
label{display:block;font-weight:600;margin:10px 0 4px}
input[type=text],input[type=file],textarea,select{width:100%;min-height:44px;font:inherit;padding:8px;border:1px solid #6b7580;border-radius:6px;background:#fff;color:var(--fg)}
input[type=checkbox]{width:24px;height:24px;vertical-align:middle;margin-right:8px}
button,.btn{font:inherit;min-height:44px;padding:8px 16px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer;text-decoration:none;display:inline-block}
button.secondary,.btn.secondary{background:var(--card);color:var(--accent)}
button.danger{background:var(--card);color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.6;cursor:not-allowed}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.steps{display:flex;gap:8px;list-style:none;padding:0;margin:8px 0;flex-wrap:wrap}
.steps li{padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--muted)}
.steps li[aria-current=step]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin:12px 0}
.card.pending{border:2px solid var(--info);background:var(--info-bg)}
.tag{display:inline-block;font-weight:700;padding:2px 8px;border-radius:4px;font-size:.9rem}
.v-CHALLENGEABLE{background:var(--bad-bg);color:var(--bad)}
.v-CONSISTENT{background:var(--ok-bg);color:var(--ok)}
.v-NEED_INFO{background:var(--info-bg);color:var(--info)}
blockquote{margin:6px 0;padding:6px 10px;border-left:4px solid var(--line);background:#f4f1ea}
.src{font-size:.9rem;color:var(--muted)}
.err{color:var(--bad);font-weight:600}
pre.expl{white-space:pre-wrap;font:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
footer{padding-top:16px;padding-bottom:32px;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line);margin-top:32px}
[hidden]{display:none!important}
@media print{header .bar,.steps,button,footer .nop{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<header>
<h1>Bima Sarthi</h1>
<p class="muted" id="tagline"></p>
<div class="bar">
<div class="seg" role="group" aria-label="Language / भाषा">
<button type="button" id="lang-en" aria-pressed="true">English</button>
<button type="button" id="lang-hi" aria-pressed="false">हिन्दी</button>
</div>
<div class="seg" role="group" id="rolegroup">
<button type="button" id="role-self" aria-pressed="true"></button>
<button type="button" id="role-helper" aria-pressed="false"></button>
</div>
<a href="#gallery" id="gal-link"></a>
</div>
<p class="muted" id="draftnote" hidden></p>
<ol class="steps" id="steps"></ol>
</header>
<main id="main" tabindex="-1" aria-live="polite">
<section id="s-upload"></section>
<section id="s-confirm" hidden></section>
<section id="s-result" hidden></section>
<section id="s-gallery" hidden></section>
</main>
<footer><!--FOOTER--></footer>

};

const REJECTION_GROUNDS=["non_disclosure","pre_existing_disease","specific_waiting_period","initial_waiting_period","portability","exclusion","deduction","room_rent","sub_limit","cashless_delay","discharge_delay","process_defect","other"];
const GROUND_LABEL={
en:{non_disclosure:"Non-disclosure of information",pre_existing_disease:"Pre-existing disease",specific_waiting_period:"Specific-illness waiting period",initial_waiting_period:"Initial waiting period",portability:"Portability or continuity",exclusion:"Listed exclusion",deduction:"Deduction from the bill",room_rent:"Room-rent limit",sub_limit:"Sub-limit",cashless_delay:"Cashless approval delay",discharge_delay:"Discharge delay",process_defect:"Process defect in the rejection",other:"Other reason"},
hi:{non_disclosure:"जानकारी न बताना",pre_existing_disease:"पहले से मौजूद बीमारी",specific_waiting_period:"विशिष्ट बीमारी की प्रतीक्षा अवधि",initial_waiting_period:"शुरुआती प्रतीक्षा अवधि",portability:"पोर्टेबिलिटी या निरंतरता",exclusion:"सूचीबद्ध अपवर्जन",deduction:"बिल से कटौती",room_rent:"कमरे के किराये की सीमा",sub_limit:"उप-सीमा",cashless_delay:"कैशलेस मंज़ूरी में देरी",discharge_delay:"डिस्चार्ज में देरी",process_defect:"अस्वीकृति की प्रक्रिया में कमी",other:"अन्य कारण"}};
const BOOL_KEYS=["fraud_alleged","crc_approval_mentioned","reasons_cite_terms","continuity_confirmed","cited_clause_found"];
const LETTER_FIELDS=[["policyholder_name","name"],["policy_number","policy"],["claim_number","claimno"],["claim_amount_inr","amount"],["insurer_name","insurer"],["complaint_sent_date","sentdate"]];
const CONT_GROUNDS=["pre_existing_disease","portability","specific_waiting_period","initial_waiting_period","non_disclosure"];
const ADD_KEYS=["claim_date","admission_date","inception_date","policy_renewal_date"];
let lang="en",helper=false,sid=null,facts={},result=null,view="upload",labelMap={},backend=null;
const $=id=>document.getElementById(id);
const t=k=>(T[lang][k]??T.en[k]??k);
function el(tag,attrs,...kids){const e=document.createElement(tag);
 for(const[k,v]of Object.entries(attrs||{})){if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,"");else if(v!==false&&v!=null)e.setAttribute(k,v);}
 for(const c of kids.flat()){if(c==null)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}return e;}
function show(name){view=name;for(const n of["upload","confirm","result","gallery"])$("s-"+n).hidden=n!==name;renderSteps();$("main").focus({preventScroll:false});window.scrollTo(0,0);}
function renderSteps(){const o=$("steps");o.replaceChildren();[["upload","s1"],["confirm","s2"],["result","s3"]].forEach(([n,k])=>{const li=el("li",{},t(k));if(n===view)li.setAttribute("aria-current","step");o.append(li);});o.hidden=view==="gallery";}
async function api(method,path,body,form){
 const opt={method,headers:{}};
 if(form)opt.body=form;else if(body){opt.headers["content-type"]="application/json";opt.body=JSON.stringify(body);}
 const r=await fetch(path,opt);let data=null;
 try{data=await r.json();}catch(e){}
 if(!r.ok){const d=data&&data.detail;const err=new Error(typeof d==="string"?d:(d&&d.message)||t("err"));err.status=r.status;err.detail=d;throw err;}
 return data;}
function showErr(box,e){box.replaceChildren();if(e.status===404&&sid){sid=null;}
 const d=e.detail;const msg=e.status===404?t("expired"):e.message;
 box.append(el("p",{class:"err",role:"alert"},msg));
 if(d&&d.errors)box.append(el("ul",{},Object.entries(d.errors).map(([k,v])=>el("li",{},labelOf(k)+": "+v))));}
async function refreshExplain(){if(!result||!sid)return;
 try{const ex=await api("POST",`/session/${sid}/explain?lang=${lang}&helper=${helper?1:0}`);result.text=ex.text||"";result.findings=ex.findings||result.findings;result.deadlines=ex.deadlines||result.deadlines;labelMap=ex.labels||labelMap;backend=ex.reader_backend||backend;}catch(e){}
 if(view==="result")renderResult();}
function applyLang(){document.documentElement.lang=lang;
 $("tagline").textContent=t("tagline");$("role-self").textContent=t("self");$("role-helper").textContent=t("helper");$("gal-link").textContent=t("gallery");
 $("lang-en").setAttribute("aria-pressed",lang==="en");$("lang-hi").setAttribute("aria-pressed",lang==="hi");
 $("role-self").setAttribute("aria-pressed",!helper);$("role-helper").setAttribute("aria-pressed",helper);
 const dn=$("draftnote");dn.hidden=lang!=="hi";dn.textContent=DRAFT_HI;
 renderAll();refreshExplain();}
function renderAll(){renderUpload();if(Object.keys(facts).length)renderConfirm();if(result)renderResult();if(view==="gallery")loadGallery();renderSteps();}

/* ---- step 1 ---- */
function renderUpload(){const s=$("s-upload");s.replaceChildren();
 const err=el("div",{id:"up-err"}),status=el("p",{role:"status"});
 const file=el("input",{type:"file",id:"files",accept:".jpg,.jpeg,.png,.pdf,image/jpeg,image/png,application/pdf",multiple:true,capture:false});
 const btn=el("button",{type:"submit"},t("up_b"));
 const form=el("form",{onsubmit:async ev=>{ev.preventDefault();err.replaceChildren();
  if(!file.files.length)return;btn.disabled=true;status.textContent=t("reading");
  try{if(!sid)sid=(await api("POST","/session")).session_id;
   const fd=new FormData();for(const f of file.files)fd.append("files",f);
   const r=await api("POST",`/session/${sid}/extract`,null,fd);facts=r.facts;backend=r.reader_backend||null;result=null;renderConfirm();show("confirm");}
  catch(e){showErr(err,e);}finally{btn.disabled=false;status.textContent="";}}},
  el("label",{for:"files"},t("up_l")),file,el("p",{},btn),status,err);
 s.append(el("h2",{},t("up_h")),el("p",{},t("up_p")),form);}

/* ---- step 2 ---- */
function labelOf(k){const l=(facts[k]&&facts[k].label)||(Object.hasOwn(labelMap,k)?labelMap[k]:null);return l?(l[lang]||l.en):k.replaceAll("_"," ");}
function factLabel(k){return labelOf(k);}
function valText(v){if(v==null)return"";if(typeof v==="boolean")return v?t("yes"):t("no");if(typeof v==="object")return JSON.stringify(v);return String(v);}
function showVal(v,k){if(v==null)return"";if(typeof v==="boolean")return v?t("yes"):t("no");
 if(typeof v==="string")return k==="rejection_ground"&&Object.hasOwn(GROUND_LABEL[lang],v)?GROUND_LABEL[lang][v]:v;
 if(Array.isArray(v))return v.map(x=>showVal(x,k)).join("; ");
 if(typeof v==="object")return Object.entries(v).filter(([,x])=>x!=null).map(([kk,x])=>labelOf(kk)+": "+showVal(x,kk)).join(", ");
 return String(v);}
function parseEdit(k,txt,orig){txt=txt.trim();
 if(Array.isArray(orig)&&orig.length&&typeof orig[0]==="object"){try{return JSON.parse(txt);}catch(e){return txt;}}
 return txt;}
function renderConfirm(){const s=$("s-confirm");s.replaceChildren();
 const err=el("div"),inputs={};
 const view_facts={...facts};
 if(!view_facts.rejection_ground)view_facts.rejection_ground={value:null,quote:null,page_no:null,status:"needs_confirmation"};
 const keys=Object.keys(view_facts);
 const order=[...keys.filter(k=>view_facts[k].status==="needs_confirmation"),...keys.filter(k=>view_facts[k].status!=="needs_confirmation")];
 const list=el("div");
 for(const k of order){const f=view_facts[k],pend=f.status==="needs_confirmation";
  const id="f-"+k;let inp,chk=null,control,isBool=BOOL_KEYS.includes(k)||typeof f.value==="boolean",isGround=k==="rejection_ground";
  if(isBool){const cur=typeof f.value==="boolean"?f.value:null,keep=pend?null:cur;
   const mk=(v,lab)=>{const r=el("input",{type:"radio",name:"b-"+k,id:`b-${k}-${v}`,value:v,checked:keep===(v==="yes")});return el("label",{for:`b-${k}-${v}`,style:"display:inline-block;font-weight:400;margin-right:16px"},r,lab);};
   const yes=mk("yes",t("yes")),no=mk("no",t("no"));
   control=el("fieldset",{style:"border:0;padding:0;margin:8px 0"},el("legend",{style:"font-weight:600"},t("edit")),yes,no);
   inputs[k]={radios:[yes.firstChild,no.firstChild],bool:true,pend,keep};}
  else if(k==="deductions"&&Array.isArray(f.value)&&f.value.length&&f.value.every(x=>x&&typeof x==="object")){
   const rows=f.value.map((it,i)=>{const nm="d-"+i,cur=it.nonpayable_listed;
    const mk=(v,lab)=>{const r=el("input",{type:"radio",name:nm,id:`${nm}-${v}`,value:v,checked:v==="yes"?cur===true:v==="no"?cur===false:(cur!==true&&cur!==false)});return el("label",{for:`${nm}-${v}`,style:"display:inline-block;font-weight:400;margin-right:16px"},r,lab);};
    const y=mk("yes",t("yes")),n=mk("no",t("no")),u=mk("unsure",t("notsure"));
    return {it,radios:[y.firstChild,n.firstChild,u.firstChild],node:el("fieldset",{style:"border:0;padding:0;margin:8px 0"},el("legend",{style:"font-weight:600"},[it.item,it.amount!=null?` — ${it.amount}`:""].join("")+" — "+t("listed_q")),y,n,u)};});
   control=rows.map(r=>r.node);inputs[k]={items:rows,pend};}
  else if(isGround){inp=el("select",{id},el("option",{value:""},t("choose")),REJECTION_GROUNDS.map(g=>el("option",{value:g,selected:g===f.value},GROUND_LABEL[lang][g])));
   if(!REJECTION_GROUNDS.includes(f.value))inp.value="";
   control=[el("label",{for:id},t("edit")),inp];inputs[k]={inp,orig:f.value,shown:inp.value,sel:true,pend};}
  else{inp=el("input",{type:"text",id,value:valText(f.value)});inputs[k]={inp,orig:f.value,shown:valText(f.value)};
   chk=el("input",{type:"checkbox",id:"c-"+k,checked:!pend});inputs[k].chk=chk;
   control=[el("label",{for:id},t("edit")),inp,el("p",{},el("label",{for:"c-"+k,style:"font-weight:400"},chk,t("confirm")))];}
  list.append(el("div",{class:"card"+(pend?" pending":""),"data-key":k},
   el("h3",{},labelOf(k)+" ",el("span",{class:"tag "+(pend?"v-NEED_INFO":"v-CONSISTENT")},pend?t("need"):(f.status==="user_confirmed"?t("done"):t("ok_read")))),
   el("p",{class:"src"},t("src")+(f.page_no!=null?` (${t("page")} ${f.page_no})`:"")+":"),
   el("blockquote",{},f.quote||t("none")),control));}
 const more=el("div",{class:"card"},el("h3",{},t("more")));
 for(const[k,lab]of LETTER_FIELDS){const f=facts[k];const i=el("input",{type:"text",id:"l-"+k,value:f?valText(f.value):""});inputs["L:"+k]={inp:i};more.append(el("label",{for:"l-"+k},t(lab)),i);}
 const reply=el("input",{type:"text",id:"reply",placeholder:"DD/MM/YYYY",inputmode:"numeric"});more.append(el("label",{for:"reply"},t("replydate")),reply);
 const g=facts.rejection_ground&&facts.rejection_ground.value;
 const addBox=el("div",{class:"card"},el("h3",{},t("add_h")),el("p",{class:"src"},t("add_p")));
 const added={};
 for(const k of ADD_KEYS){if(facts[k])continue;const i=el("input",{type:"text",id:"a-"+k,placeholder:"DD/MM/YYYY",inputmode:"numeric"});added[k]=i;addBox.append(el("label",{for:"a-"+k},labelOf(k)),i);}
 let cont=null;
 if(CONT_GROUNDS.includes(g)||facts.ported_from_date||facts.renewal_gap_days){
  const cur=facts.continuity_confirmed&&typeof facts.continuity_confirmed.value==="boolean"&&facts.continuity_confirmed.status!=="needs_confirmation"?facts.continuity_confirmed.value:null;
  const mk=(v,lab)=>{const r=el("input",{type:"radio",name:"cont",id:"cont-"+v,value:v,checked:v==="yes"?cur===true:v==="no"?cur===false:false});return el("label",{for:"cont-"+v,style:"display:inline-block;font-weight:400;margin-right:16px"},r,lab);};
  const y=mk("yes",t("yes")),n=mk("no",t("no")),u=mk("unsure",t("notsure"));
  cont={radios:[y.firstChild,n.firstChild,u.firstChild]};
  more.append(el("fieldset",{style:"border:0;padding:0;margin:8px 0"},el("legend",{style:"font-weight:600"},t("cont")),y,n,u));}
 const run=el("button",{type:"button",onclick:async()=>{err.replaceChildren();run.disabled=true;
  const payload={};
  for(const[k,o]of Object.entries(inputs)){
   if(k.startsWith("L:")){const v=o.inp.value.trim();if(v)payload[k.slice(2)]={value:v};continue;}
   if(o.items){const vals=o.items.map(r=>{const c=r.radios.find(x=>x.checked);return {...r.it,nonpayable_listed:c&&c.value==="yes"?true:c&&c.value==="no"?false:null};});
    if(o.pend||vals.some((v,i)=>v.nonpayable_listed!==(o.items[i].it.nonpayable_listed??null)))payload[k]={value:vals};continue;}
   if(o.bool){const r=o.radios.find(x=>x.checked);if(r&&(o.pend||(r.value==="yes")!==o.keep))payload[k]={value:r.value};continue;}
   if(o.sel){if(o.inp.value&&(o.inp.value!==o.shown||o.pend))payload[k]={value:o.inp.value};continue;}
   const changed=o.inp.value!==o.shown;
   if(changed)payload[k]={value:parseEdit(k,o.inp.value,o.orig)};else if(o.chk.checked&&facts[k].status==="needs_confirmation")payload[k]={confirm:true};}
  for(const[k,i]of Object.entries(added)){const v=i.value.trim();if(v)payload[k]={value:v};}
  if(cont){const c=cont.radios.find(x=>x.checked);
   if(c&&c.value!=="unsure")payload.continuity_confirmed={value:c.value==="yes"};
   else if(c&&facts.continuity_confirmed)payload.continuity_confirmed={clear:true};}
  const body={facts:payload};if(reply.value.trim())body.insurer_reply_date=reply.value.trim();
  try{const r=await api("PUT",`/session/${sid}/facts`,body);facts=r.facts;
   const c=await api("POST",`/session/${sid}/check`);
   let ex={text:"",findings:c.findings,deadlines:c.deadlines};
   try{ex=await api("POST",`/session/${sid}/explain?lang=${lang}&helper=${helper?1:0}`);}catch(e){}
   labelMap=c.labels||labelMap;backend=c.reader_backend||backend;result={findings:c.findings,deadlines:c.deadlines,text:ex.text||""};renderResult();show("result");}
  catch(e){showErr(err,e);if(e.detail&&e.detail.needs_confirmation)err.append(el("ul",{},e.detail.needs_confirmation.map(k=>el("li",{},factLabel(k)))));}
  finally{run.disabled=false;}}},t("run"));
 s.append(el("h2",{},t("cf_h")),el("p",{},t("cf_p")),list,addBox,more,err,el("p",{},run," ",el("button",{type:"button",class:"secondary",onclick:()=>show("upload")},t("back"))));}

/* ---- step 3 ---- */
function verdictCard(f,withLocalised){
 const q=lang==="hi"?(f.question_hi||f.question_en):f.question_en,a=lang==="hi"?(f.action_hi||f.action_en):f.action_en;
 const c=el("article",{class:"card"},
  el("h3",{},el("span",{class:"tag v-"+f.verdict},t(f.verdict))," ",f.rule_id.replaceAll("_"," ")),
  el("p",{class:"src"},t("rule")+(f.page_no!=null?` (${t("page")} ${f.page_no})`:"")+":"),el("blockquote",{},f.rule_quote));
 const used=Object.entries(f.facts_used||{}).filter(([,v])=>v.quote);
 if(used.length){c.append(el("p",{class:"src"},t("fq")+":"));
  for(const[k,v]of used)c.append(el("blockquote",{},el("strong",{},labelOf(k)+": "),showVal(v.value,k)," — “"+v.quote+"”"+(v.page_no!=null?` (${t("page")} ${v.page_no})`:"")));}
 if(f.verdict==="NEED_INFO"&&q)c.append(el("p",{},el("strong",{},t("ask")+": "),q));
 if(f.verdict!=="CONSISTENT"&&a)c.append(el("p",{},el("strong",{},t("act")+": "),a));
 return c;}
function dlItem(k,date,src){if(!date)return"";const li=el("li",{},t(k)+": "+date.display);
 if(src&&src.label)li.append(el("div",{class:"src"},src.label));
 else if(src&&src.quote)li.append(el("div",{class:"src"},t("rule")+(src.page_no!=null?` (${t("page")} ${src.page_no})`:"")+(src.source_id?` · ${t("src")}: ${src.source_id}`:"")+":"),el("blockquote",{},src.quote));
 return li;}
function renderResult(){const s=$("s-result");s.replaceChildren();
 const err=el("div");
 s.append(el("h2",{},t("r_h")));
 if(!result.findings.length)s.append(el("p",{},t("no_find")));
 const ord={CHALLENGEABLE:0,NEED_INFO:1,CONSISTENT:2};
 [...result.findings].sort((a,b)=>ord[a.verdict]-ord[b.verdict]).forEach(f=>s.append(verdictCard(f)));
 if(result.text)s.append(el("h3",{},t("expl")),el("pre",{class:"expl"},result.text));
 if(backend)s.append(el("p",{class:"src"},t("backend")+": "+backend));
 const d=result.deadlines;
 if(d&&d.available){s.append(el("div",{class:"card"},el("h3",{},t("dl")),el("ul",{},
  dlItem("d1",d.insurer_reply_by,d.sources&&d.sources.insurer_reply_by),dlItem("d2",d.ombudsman_earliest,d.sources&&d.sources.ombudsman_earliest),dlItem("d3",d.ombudsman_latest,d.sources&&d.sources.ombudsman_latest)),
  el("p",{class:"src"},d.note),
  d.rule_quote?el("p",{class:"src"},t("rule")+(d.page_no!=null?` (${t("page")} ${d.page_no})`:"")+(d.source_sha256?` · ${t("src")}: ${d.source_sha256.slice(0,12)}`:"")+":"):"",
  d.rule_quote?el("blockquote",{},d.rule_quote):"")));}
 else if(d&&d.note&&result.findings.some(f=>f.verdict==="CHALLENGEABLE"))s.append(el("p",{class:"src"},d.note));
 const acts=el("p");
 if(result.findings.some(f=>f.verdict==="CHALLENGEABLE")&&d&&d.available&&d.letter_available!==false)acts.append(el("a",{class:"btn",href:`/session/${sid}/letter.pdf?lang=${lang}`,download:"grievance-letter.pdf"},t("letter"))," ");
 if(helper)acts.append(el("button",{type:"button",class:"secondary",onclick:()=>window.print()},t("print"))," ");
 acts.append(el("button",{type:"button",class:"danger",onclick:async()=>{try{if(sid)await api("DELETE","/session/"+sid);}catch(e){}
   sid=null;facts={};result=null;renderUpload();$("s-result").replaceChildren(el("p",{role:"status"},t("deleted")),el("button",{type:"button",onclick:()=>show("upload")},t("again")));}},t("del")));
 s.append(acts,err);}

/* ---- gallery ---- */
async function loadGallery(){const s=$("s-gallery");s.replaceChildren(el("h2",{},t("g_h")),el("p",{},t("g_p")));
 const err=el("div");s.append(err);
 try{const r=await api("GET","/gallery");
  if(!r.cases.length)s.append(el("p",{},t("g_empty")));
  for(const c of r.cases){s.append(el("div",{class:"card"},el("h3",{},c.citation.case_number||c.case_id),
   el("p",{class:"src"},[c.citation.forum,c.citation.decided_on].filter(Boolean).join(", ")),
   el("p",{},c.verdicts.map(v=>el("span",{class:"tag v-"+v},t(v)+" "))),
   el("button",{type:"button",class:"secondary",onclick:()=>openCase(c.case_id)},t("gallery"))));}
  s.append(el("p",{class:"src"},r.attribution));}catch(e){showErr(err,e);}
 s.append(el("p",{},el("button",{type:"button",onclick:()=>{location.hash="";show(sid?"confirm":"upload");}},t("gback"))));}
async function openCase(id){const s=$("s-gallery");s.replaceChildren();const err=el("div");
 try{const c=await api("GET","/gallery/"+encodeURIComponent(id));
  s.append(el("h2",{},c.citation.case_number||c.case_id),
   el("p",{class:"src"},[c.citation.forum,c.citation.decided_on,c.insurer].filter(Boolean).join(", ")),
   el("p",{},el("strong",{},t("outcome")+": "),c.outcome||""));
  c.findings.forEach(f=>s.append(verdictCard(f)));
  s.append(el("p",{class:"src"},(typeof c.citation.source_url==="string"&&/^https:\/\//.test(c.citation.source_url))?el("a",{href:c.citation.source_url,rel:"noopener noreferrer"},t("srcurl")):"","  ",c.attribution||t("powered")));}
 catch(e){showErr(err,e);s.append(err);}
 s.append(el("p",{},el("button",{type:"button",onclick:loadGallery},t("gback"))));}

/* ---- wiring ---- */
$("lang-en").onclick=()=>{lang="en";applyLang();};
$("lang-hi").onclick=()=>{lang="hi";applyLang();};
$("role-self").onclick=()=>{helper=false;applyLang();};
$("role-helper").onclick=()=>{helper=true;applyLang();};
$("gal-link").onclick=ev=>{ev.preventDefault();show("gallery");loadGallery();};
applyLang();show("upload");
</script>
