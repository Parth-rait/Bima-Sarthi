# English explanation templates (source of truth). Placeholders are filled by explain.templated().
# Wording rules: never promise an outcome; never say the insurer's decision is right or wrong;
# never comment on treatment or diagnosis.
labels:
  quote_intro: "What the rule says"
  facts_intro: "What your documents show"
  fact_quote: "source text"
  page: "page"
  question_label: "Question to settle"
  action_label: "What you can do"
  rule_label: "Rule"
  "yes": "yes"
  "no": "no"
  english_marker: ""
  footer: "This is a rules check, not legal or medical advice. It does not promise any result."
  units: {months: "months", days: "days", minutes: "minutes", years: "years", hours: "hours", weeks: "weeks", fortnights: "fortnights"}
  nonpayable: "non-payable"
  no_rule: "We don't have a checked rule for this reason yet. This does not mean the decision is correct."
  general_title: "We don't have a checked rules engine for this type of insurance yet. This does not mean the decision is correct. Here is a general way to take your case forward."
  missing_prefix: "missing "
CHALLENGEABLE:
  self: "On the facts in your documents, there is a documented possible inconsistency between this decision and the rule quoted below. It may be worth raising with the insurer. This does not predict any outcome."
  helper: "On the facts in their documents, there is a documented possible inconsistency between the decision on their claim and the rule quoted below. It may be worth raising with the insurer. This does not predict any outcome."
CONSISTENT:
  self: "The rule quoted below gives no ground to challenge the decision on this point. This check covers only this rule."
  helper: "The rule quoted below gives no ground to challenge the decision on this point in their claim. This check covers only this rule."
NEED_INFO:
  rule_not_in_force:
    self: "We could not apply the rule quoted below to your claim because it was not in force on the relevant date."
    helper: "We could not apply the rule quoted below to their claim because it was not in force on the relevant date."
  missing_inputs:
    self: "We need a little more information from you before we can check the rule quoted below: {missing}."
    helper: "We need a little more information about their claim before we can check the rule quoted below: {missing}."
  condition_not_automated:
    self: "The rule quoted below cannot be checked automatically. Please read it against your documents, or ask a grievance officer or an advisor."
    helper: "The rule quoted below cannot be checked automatically. Please read it against their documents, or ask a grievance officer or an advisor."
  missing_date:
    self: "We cannot check the rule quoted below yet because a date is missing: {missing}."
    helper: "We cannot check the rule quoted below for their claim yet because a date is missing: {missing}."
  default:
    self: "We cannot say yet whether the rule quoted below applies to your claim, because we do not yet have the information that rule depends on. The rule is quoted below so you can see what it needs."
    helper: "We cannot say yet whether the rule quoted below applies to their claim, because we do not yet have the information that rule depends on. The rule is quoted below so you can see what it needs."
